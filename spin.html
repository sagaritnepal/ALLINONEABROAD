<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Spin &amp; Win | ALL IN ONE ABROAD</title>
  <meta name="description" content="Spin the wheel and win a gift from ALL IN ONE ABROAD."/>
  <meta name="robots" content="noindex"/>
  <meta name="theme-color" content="#ffffff"/>
  <link rel="icon" href="/favicon.ico" sizes="any"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    :root { --orange:#f97316; --orange-dark:#c2410c; --tint:#fff7ed; --ink:#111827; --gray:#6b7280; --line:#e5e7eb; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; color:var(--ink); background:var(--tint); min-height:100vh; }
    header { background:#fff; border-bottom:1px solid var(--line); padding:12px 16px; text-align:center; }
    header img { height:40px; width:auto; }
    main { max-width:440px; margin:0 auto; padding:24px 16px 48px; }
    h1 { font-size:26px; font-weight:800; text-align:center; }
    h1 em { color:var(--orange); font-style:normal; }
    .sub { text-align:center; color:var(--gray); font-size:14px; margin:6px 0 20px; }
    .card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:18px; box-shadow:0 1px 3px rgba(0,0,0,.05); }
    label { display:block; font-size:12px; font-weight:700; color:var(--gray); margin:0 0 6px; }
    input { width:100%; height:46px; border:1.5px solid var(--line); border-radius:10px; padding:0 12px; font:inherit; font-size:15px; margin-bottom:14px; }
    input:focus { outline:none; border-color:var(--orange); box-shadow:0 0 0 3px rgba(249,115,22,.18); }
    .wheel-wrap { position:relative; width:min(100%,340px); aspect-ratio:1; margin:20px auto 8px; }
    #wheel { width:100%; height:100%; border-radius:50%; transition:transform 5s cubic-bezier(.12,.67,.1,1); box-shadow:0 0 0 6px #fff, 0 0 0 8px var(--orange), 0 8px 24px rgba(0,0,0,.15); }
    .pointer { position:absolute; top:-10px; left:50%; width:0; height:0; margin-left:-13px; border-left:13px solid transparent; border-right:13px solid transparent; border-top:26px solid var(--ink); filter:drop-shadow(0 2px 2px rgba(0,0,0,.3)); z-index:2; }
    .hub { position:absolute; top:50%; left:50%; width:46px; height:46px; margin:-23px 0 0 -23px; background:#fff; border:4px solid var(--orange); border-radius:50%; z-index:1; }
    button { width:100%; height:50px; border:0; border-radius:12px; background:var(--orange); color:#fff; font:inherit; font-size:16px; font-weight:800; cursor:pointer; }
    button:hover { background:var(--orange-dark); }
    button:disabled { opacity:.55; cursor:default; }
    .msg { margin-top:14px; font-size:14px; text-align:center; color:#b91c1c; min-height:20px; }
    .win { display:none; text-align:center; margin-top:18px; padding:18px; border-radius:14px; background:#f0fdf4; border:1.5px solid #86efac; }
    .win.show { display:block; }
    .win small { display:block; color:#15803d; font-weight:700; font-size:12px; text-transform:uppercase; letter-spacing:.06em; }
    .win strong { display:block; font-size:24px; font-weight:800; margin:6px 0; color:#14532d; }
    .win span { font-size:13px; color:var(--gray); }
    .note { text-align:center; color:var(--gray); font-size:12px; margin-top:16px; }
  </style>
</head>
<body>
<header><img src="allinonelogo.png" alt="ALL IN ONE ABROAD"/></header>
<main>
  <h1>Spin &amp; <em>Win</em></h1>
  <p class="sub">Enter your name and mobile number, then spin the wheel. One spin for each number.</p>

  <div class="card">
    <form id="form" autocomplete="on" novalidate>
      <label for="name">Your name</label>
      <input id="name" name="name" type="text" autocomplete="name" placeholder="Full name" maxlength="80" required/>
      <label for="phone">Mobile number</label>
      <input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="98XXXXXXXX" maxlength="20" required/>

      <div class="wheel-wrap" aria-hidden="true">
        <div class="pointer"></div>
        <canvas id="wheel" width="680" height="680"></canvas>
        <div class="hub"></div>
      </div>

      <button id="spin" type="submit" disabled>Loading the wheel...</button>
      <p class="msg" id="msg" role="alert"></p>
    </form>

    <div class="win" id="win" role="status" aria-live="polite">
      <small>You won</small>
      <strong id="prize"></strong>
      <span>Show this screen at our shop to collect your gift.</span>
    </div>
  </div>
  <p class="note">ALL IN ONE ABROAD &middot; Jorpati Chamunda Gate, Kathmandu</p>
</main>

<script>
(function () {
  // The app's public values, the same ones the shop's product feed uses. The wheel is drawn from offer_prizes_public and the
  // draw is made by the database (spin_wheel), never in this page, so the result cannot be changed from the browser.
  var APP = {
    url: 'https://boiiqzkkbyzqkqsxuzyp.supabase.co',
    key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJvaWlxemtrYnl6cWtxc3h1enlwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4Mzc3MjMsImV4cCI6MjEwNjQxMzcyM30.K-NKzPpIiIIymRvSwKNFHDxgAk9LLwCVHjYi8vQWiHA',
    owner: '664018d3-d517-4ac3-b2fa-0d8589d23c5c'
  };
  var COLORS = ['#f97316', '#fb923c', '#fdba74', '#ea580c', '#fed7aa', '#c2410c'];
  var canvas = document.getElementById('wheel');
  var ctx = canvas.getContext('2d');
  var form = document.getElementById('form');
  var spinBtn = document.getElementById('spin');
  var msg = document.getElementById('msg');
  var win = document.getElementById('win');
  var prizeEl = document.getElementById('prize');
  var prizes = [];
  var turns = 0;
  var spinning = false;

  function rpc(name, body) {
    return fetch(APP.url + '/rest/v1/rpc/' + name, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: APP.key, Authorization: 'Bearer ' + APP.key },
      body: JSON.stringify(body)
    }).then(function (res) { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); });
  }

  function draw() {
    var n = prizes.length, size = canvas.width, c = size / 2, seg = (Math.PI * 2) / n;
    ctx.clearRect(0, 0, size, size);
    for (var i = 0; i < n; i++) {
      var start = -Math.PI / 2 + i * seg;           // segment 0 begins at the top and runs clockwise
      ctx.beginPath(); ctx.moveTo(c, c); ctx.arc(c, c, c - 4, start, start + seg); ctx.closePath();
      ctx.fillStyle = COLORS[i % COLORS.length]; ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.stroke();
      ctx.save();
      ctx.translate(c, c); ctx.rotate(start + seg / 2);
      ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      ctx.fillStyle = (i % COLORS.length === 2 || i % COLORS.length === 4) ? '#7c2d12' : '#fff';
      ctx.font = '700 ' + (n > 8 ? 26 : 32) + 'px Inter, sans-serif';
      var label = prizes[i].length > 16 ? prizes[i].slice(0, 15) + '…' : prizes[i];
      ctx.fillText(label, c - 36, 0);
      ctx.restore();
    }
  }

  function setBusy(text, busy) { spinBtn.textContent = text; spinBtn.disabled = busy; }

  function showWin(prize) {
    prizeEl.textContent = prize;
    win.classList.add('show');
    setBusy('You have spun', true);
    try { sessionStorage.setItem('aio_spin_prize', prize); } catch (e) {}
  }

  // The wheel turns whole times, then stops with the winning segment's middle under the pointer at the top.
  function land(prize) {
    var n = prizes.length, seg = 360 / n;
    var index = prizes.indexOf(prize);
    if (index < 0) index = 0;
    var jitter = (Math.random() - 0.5) * seg * 0.6;
    turns += 6;
    var rotation = turns * 360 - (index * seg + seg / 2) + jitter;
    canvas.style.transform = 'rotate(' + rotation + 'deg)';
    setTimeout(function () { showWin(prize); spinning = false; }, 5200);
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (spinning || !prizes.length) return;
    msg.textContent = '';
    var name = document.getElementById('name').value.trim();
    var phone = document.getElementById('phone').value.trim();
    if (name.length < 2 || phone.replace(/\D/g, '').length < 7) { msg.textContent = 'Enter your name and mobile number.'; return; }
    spinning = true;
    setBusy('Spinning...', true);
    rpc('spin_wheel', { p_owner: APP.owner, p_name: name, p_phone: phone }).then(function (r) {
      if (r && r.ok) { land(r.prize); return; }
      spinning = false;
      msg.textContent = (r && r.message) || 'Please try again.';
      setBusy('Spin the wheel', false);
    }).catch(function () {
      spinning = false;
      msg.textContent = 'Could not reach the server. Check your internet and try again.';
      setBusy('Spin the wheel', false);
    });
  });

  var earlier = null;
  try { earlier = sessionStorage.getItem('aio_spin_prize'); } catch (e) {}

  rpc('offer_prizes_public', { p_owner: APP.owner }).then(function (rows) {
    prizes = (rows || []).map(function (r) { return r.name; });
    if (!prizes.length) {
      if (earlier) { showWin(earlier); return; }
      setBusy('No prizes right now', true);
      msg.textContent = 'All the prizes have been won. Thank you for visiting!';
      return;
    }
    draw();
    if (earlier) { showWin(earlier); return; }
    setBusy('Spin the wheel', false);
  }).catch(function () {
    setBusy('Spin the wheel', true);
    msg.textContent = 'The wheel could not be loaded. Please try again in a moment.';
  });
})();
</script>
</body>
</html>
